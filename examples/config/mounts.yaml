# ---
# title: example space data mounts (public template)
# ---

# Install privately as ~/.config/meta-project/mounts.yaml.
# Keys are the *-space project.id.

# Single mount:
#   link: data          # optional (default data)
#   data: { id, stem }

# Several mounts (e.g. notes-space):
#   links:
#     - link: mint-notes
#       data: { id, stem }

# ---

mounts:
  00000000-0000-0000-0000-000000000001:
    # Example Space (one data stem)
    link: data
    data:
      id: 00000000-0000-0000-0000-000000000002
      stem: example
  00000000-0000-0000-0000-000000000010:
    # Example Notes Space (several collections)
    links:
      - link: trivial-notes
        data:
          id: 00000000-0000-0000-0000-000000000011
          stem: trivial-notes
      - link: personal-notes
        data:
          id: 00000000-0000-0000-0000-000000000012
          stem: personal-notes
