# ---
# title: Example Private Git Remotes
# ---

# Install privately as ~/.config/meta-project/remotes.yaml.
# Keys are project.id values from the respective .mtdt.yaml files.

# ---

remotes:
  00000000-0000-0000-0000-000000000000:
    # Example Project
    mirror-glab:
      url: git@gitlab.com:example/example-project.git
    mirror-nas:
      url: ssh://nas.example.invalid/git/example-project.git
